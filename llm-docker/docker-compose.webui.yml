# Open WebUI: one browser front end over the engines in this stack.
#   chat        -> ollama   (same compose network, so the service name resolves)
#   images      -> forge    (docker-compose.forge.yml; joins llm-network when started)
#   text-to-speech -> kokoro (docker-compose.speech.yml)
#   speech-to-text  -> built-in local whisper (CPU, inside this container) by default
#
# The FIRST account created becomes the administrator: open it yourself before the port
# is reachable by anyone else. Telemetry is off; nothing leaves the machine.
#
# DERIVED: image and variables from Open WebUI's own documentation; not verified through
# this repo. Port from .env (WEBUI_PORT); upstream default is 8080.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "0.0.0.0:${WEBUI_PORT:-8080}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_IMAGE_GENERATION=true
      - IMAGE_GENERATION_ENGINE=automatic1111
      - AUTOMATIC1111_BASE_URL=http://forge:7860
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://kokoro:8880/v1
      - AUDIO_TTS_OPENAI_API_KEY=not-needed
      - AUDIO_TTS_MODEL=kokoro
      - AUDIO_TTS_VOICE=af_heart
      - ANONYMIZED_TELEMETRY=False
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
    volumes:
      - ${DATA_PATH:-/mnt/llm-data}/open-webui:/app/backend/data

networks:
  default:
    name: llm-network
